# Färgtemat för dashboarden. Streamlit läser filen automatiskt när appen startas.
# Mörkt tema med blå detaljer, så att knappar, filter och flikar passar ihop med diagrammens färger.
# Färgerna i diagrammen och CSS:en ligger i installningar.py – ändrar du en färg här, ändra den där också.
[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0b0e14"
secondaryBackgroundColor = "#151a23"
textColor = "#e8eaf0"

[theme.sidebar]
backgroundColor = "#0f131b"
secondaryBackgroundColor = "#1a202b"
